<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Méta-données techniques (Essentielles pour l'affichage) -->
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    
    <!-- Méta-donnée SEO (Pour Google) -->
    <meta name="description" content="Portfolio personnel de Wahib développé avec React.js" />
    
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    
    <!-- Le titre qui s'affiche dans l'onglet du navigateur -->
    <title>Wahib | Portfolio</title>

    <!-- Google / Search Engine Tags -->
    <meta itemprop="name" content="Wahib | Portfolio" />
    <meta itemprop="description" content="Portfolio personnel de Wahib développé avec React.js" />
    <!-- Remplacez le lien de l'image ci-dessous par une URL vers votre propre image (ex: une capture d'écran de votre site) -->
    <meta itemprop="image" content="%PUBLIC_URL%/favicon.png" />

    <!-- Facebook / LinkedIn Meta Tags (Open Graph) - C'est ce qui s'affiche quand on partage votre lien -->
    <meta property="og:url" content="https://wahib-git.github.io/portfolio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wahib | Portfolio" />
    <meta property="og:description" content="Portfolio personnel de Wahib développé avec React.js" />
    <meta property="og:image" content="%PUBLIC_URL%/favicon.png" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wahib | Portfolio" />
    <meta name="twitter:description" content="Portfolio personnel de Wahib développé avec React.js" />
    <meta name="twitter:image" content="%PUBLIC_URL%/favicon.png" />
  </head>

  <body>
    <!-- Message si le JavaScript est désactivé -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    
    <!-- C'est ICI que React va injecter tout votre site -->
    <div id="root"></div>
  </body>
</html>
